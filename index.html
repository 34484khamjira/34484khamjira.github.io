<!-- นี่คือโครงสร้างหน้าเว็บทั้งหมด -->

<!DOCTYPE html>
<html lang="th">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>หน้าแนะนำตัวของฉัน</title>

<style>

/* ============================= */
/* พื้นฐาน */
/* ============================= */

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    background: linear-gradient(135deg, #ffd6e3, #ffeef5, #dff4ff);
    color: #255;
    text-align: center;
    padding: 50px 20px;
    margin: 0;
    font-family: Arial, Tahoma, sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
}


/* ============================= */
/* วงกลมตกแต่งพื้นหลัง */
/* ============================= */

body::before {
    content: "";
    position: fixed;

    width: 300px;
    height: 300px;

    border-radius: 50%;

    background: rgba(255,255,255,0.35);

    top: -100px;
    left: -100px;

    z-index: -2;
}

body::after {
    content: "";
    position: fixed;

    width: 350px;
    height: 350px;

    border-radius: 50%;

    background: rgba(180,225,255,0.30);

    bottom: -130px;
    right: -100px;

    z-index: -2;
}


/* ============================= */
/* หัวใจและดาวลอย */
/* ============================= */

.floating {
    position: fixed;

    inset: 0;

    pointer-events: none;

    overflow: hidden;

    z-index: -1;
}

.floating span {
    position: absolute;

    bottom: -50px;

    color: #ffffff;

    font-size: 25px;

    opacity: 0.75;

    animation: floatUp 8s linear infinite;
}


/* ตำแหน่งแต่ละตัว */

.floating span:nth-child(1) {
    left: 5%;
    animation-delay: 0s;
}

.floating span:nth-child(2) {
    left: 15%;
    animation-delay: 2s;
}

.floating span:nth-child(3) {
    left: 28%;
    animation-delay: 4s;
}

.floating span:nth-child(4) {
    left: 42%;
    animation-delay: 1s;
}

.floating span:nth-child(5) {
    left: 55%;
    animation-delay: 3s;
}

.floating span:nth-child(6) {
    left: 68%;
    animation-delay: 5s;
}

.floating span:nth-child(7) {
    left: 80%;
    animation-delay: 2s;
}

.floating span:nth-child(8) {
    left: 92%;
    animation-delay: 4s;
}


@keyframes floatUp {

    0% {
        bottom: -50px;
        transform: translateX(0) rotate(0deg);
        opacity: 0;
    }

    20% {
        opacity: 0.75;
    }

    50% {
        transform: translateX(25px) rotate(180deg);
    }

    80% {
        opacity: 0.75;
    }

    100% {
        bottom: 110%;
        transform: translateX(-20px) rotate(360deg);
        opacity: 0;
    }

}


/* ============================= */
/* การ์ด */
/* ============================= */

.card {

    background: rgba(255,255,255,0.90);

    border-radius: 50px;

    box-shadow:
        0 10px 30px rgba(180,80,120,0.18);

    max-width: 650px;

    margin: 50px auto;

    padding: 45px 30px;

    border: 3px solid rgba(255,255,255,0.7);

    position: relative;

    animation: cardAppear 1s ease;

    transition: all 0.4s ease;
}


/* เอฟเฟกต์เมื่อเอาเมาส์ชี้ */

.card:hover {

    transform: translateY(-8px);

    box-shadow:
        0 18px 40px rgba(180,80,120,0.25);

}


/* ============================= */
/* ดาวตกแต่งบนการ์ด */
/* ============================= */

.card::before {

    content: "♡";

    position: absolute;

    top: 18px;
    left: 25px;

    font-size: 30px;

    color: #ff8fb1;

    animation: heartBeat 2s infinite;
}


.card::after {

    content: "✦";

    position: absolute;

    top: 20px;
    right: 30px;

    font-size: 25px;

    color: #75bfe8;

    animation: spinStar 4s linear infinite;
}


@keyframes heartBeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.25);
    }

}


@keyframes spinStar {

    from {
        transform: rotate(0deg);
    }

    to {
        transform: rotate(360deg);
    }

}


/* ============================= */
/* หัวข้อ */
/* ============================= */

h1 {

    color: #d65378;

    font-size: 36px;

    margin-bottom: 25px;

    line-height: 1.4;

    text-shadow:
        0 3px 8px rgba(214,83,120,0.15);

}


/* เส้นตกแต่งใต้หัวข้อ */

h1::after {

    content: "  ♡ ✦ ♡";

    display: block;

    font-size: 20px;

    color: #8bcbea;

    margin-top: 8px;

}


/* ============================= */
/* ข้อความ */
/* ============================= */

p {

    font-size: 18px;

    line-height: 1.8;

    color: #526b78;

    margin: 15px 0;

}


strong {

    color: #d65378;

}


/* ============================= */
/* ปุ่มเข้าสู่ Portfolio */
/* ============================= */

.portfolio-btn {

    display: inline-block;

    margin-top: 25px;

    padding: 15px 30px;

    background: linear-gradient(
        135deg,
        #65b5df,
        #176b9e
    );

    color: white;

    text-decoration: none;

    font-size: 18px;

    font-weight: bold;

    border-radius: 30px;

    box-shadow:
        0 7px 18px rgba(23,107,158,0.25);

    transition: all 0.3s ease;

    position: relative;

    overflow: hidden;
}


/* แสงวิ่งผ่านปุ่ม */

.portfolio-btn::before {

    content: "";

    position: absolute;

    top: 0;

    left: -100%;

    width: 60%;

    height: 100%;

    background: rgba(255,255,255,0.3);

    transform: skewX(-25deg);

    transition: 0.5s;

}


.portfolio-btn:hover::before {

    left: 130%;

}


.portfolio-btn:hover {

    background: linear-gradient(
        135deg,
        #176b9e,
        #0d527c
    );

    transform: translateY(-5px) scale(1.03);

    box-shadow:
        0 12px 25px rgba(23,107,158,0.30);

}


/* ============================= */
/* แอนิเมชันการ์ดตอนเปิดเว็บ */
/* ============================= */

@keyframes cardAppear {

    from {

        opacity: 0;

        transform:
            translateY(30px)
            scale(0.95);

    }

    to {

        opacity: 1;

        transform:
            translateY(0)
            scale(1);

    }

}


/* ============================= */
/* แถบเลื่อน */
/* ============================= */

::-webkit-scrollbar {

    width: 10px;

}


::-webkit-scrollbar-track {

    background: #ffe8f0;

}


::-webkit-scrollbar-thumb {

    background: linear-gradient(
        #ff9fbd,
        #75c7ed
    );

    border-radius: 20px;

}


::-webkit-scrollbar-thumb:hover {

    background: #65b5df;

}


/* ============================= */
/* มือถือ */
/* ============================= */

@media (max-width: 600px) {

    body {

        padding: 25px 15px;

    }


    .card {

        margin: 30px auto;

        padding: 40px 20px;

        border-radius: 35px;

    }


    h1 {

        font-size: 28px;

    }


    p {

        font-size: 16px;

    }


    .portfolio-btn {

        font-size: 16px;

        padding: 13px 25px;

    }


    .floating span {

        font-size: 18px;

    }

}

</style>

</head>


<body>


<!-- ============================= -->
<!-- หัวใจและดาวลอย -->
<!-- ============================= -->

<div class="floating">

    <span>♡</span>

    <span>✦</span>

    <span>♡</span>

    <span>✧</span>

    <span>♡</span>

    <span>✦</span>

    <span>♡</span>

    <span>✧</span>

</div>


<!-- ============================= -->
<!-- การ์ดแนะนำตัว -->
<!-- ============================= -->

<div class="card">

    <h1>
        ยินดีต้อนรับสู่โปรไฟล์ของฉัน
    </h1>


    <p>

        สวัสดีค่ะ! หนูชื่อ

        <strong>
            เขมจิรา (Khamjira)
        </strong>

    </p>


    <p>

        ขณะนี้กำลังศึกษา/สนใจด้าน

        <strong>
            Computer Science &amp; Engineering
        </strong>

    </p>


    <p>

        นี่คือเว็บไซต์แรกของฉัน

        ที่โฮสต์บน GitHub Pages!

    </p>


    <!-- ============================= -->
    <!-- ปุ่มไปหน้า Portfolio -->
    <!-- ============================= -->

    <a href="Portfolio.html" class="portfolio-btn">

        📁 เข้าสู่แฟ้มสะสมผลงาน

    </a>

</div>


</body>

</html>
